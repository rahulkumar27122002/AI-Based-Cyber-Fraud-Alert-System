name: AI Fraud Detection CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    # ---------------- Add MongoDB service ----------------
    services:
      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: user
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: mydb
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username user --password password --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------------- Python (Backend) ----------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run Python lint
        run: |
          cd backend
          pip install flake8
          flake8 . || true

      # ---------------- Node.js (Frontend) ----------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build || echo "Skipping build (no script found)"

      # ---------------- Wait for MongoDB ----------------
      - name: Wait for Mongo
        run: |
          for i in `seq 1 20`; do
            nc -z localhost 27017 && echo "Mongo up" && break
            echo "Waiting for mongo..." && sleep 2
          done

      # ---------------- Backend Tests ----------------
      - name: Run backend tests
        env:
          MONGO_URL: mongodb://user:password@localhost:27017/mydb?authSource=admin
        run: |
          cd backend
          pip install pytest
          pytest || echo "No tests found, skipping"

      # ---------------- Frontend Tests ----------------
      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false || echo "No tests found, skipping"

      # ---------------- Docker Build ----------------
      - name: Build backend Docker image
        run: docker build -t backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend:ci ./frontend
